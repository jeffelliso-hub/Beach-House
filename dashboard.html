<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LegaSea">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══ THEME VARIABLES ══ */
:root {
  --bg:          #08090d;
  --bg-overlay:  rgba(8,9,13,0.96);
  --text-1:      #f0f2f7;
  --text-2:      #c8d2e0;
  --text-3:      #aabccc;
  --text-4:      #8090a6;
  --text-5:      #5e6e82;
  --text-6:      #1e2834;
  --divider:     rgba(255,255,255,0.06);
  --card-bg:     rgba(255,255,255,0.03);
  --card-border: rgba(255,255,255,0.07);
  --accent:      #4a7fa8;
  --accent-dim:  #2a4d68;
  --soon-dot:    #b89a52;
  --rain-color:  #5a8dab;
  --btn-bg:      rgba(255,255,255,0.06);
  --btn-border:  rgba(255,255,255,0.1);
}
[data-theme="light"] {
  --bg:          #eef0f5;
  --bg-overlay:  rgba(238,240,245,0.97);
  --text-1:      #0c0e14;
  --text-2:      #1c2434;
  --text-3:      #3c4c60;
  --text-4:      #6a7c8e;
  --text-5:      #9aabbc;
  --text-6:      #beccd8;
  --divider:     rgba(0,0,0,0.09);
  --card-bg:     rgba(0,0,0,0.04);
  --card-border: rgba(0,0,0,0.10);
  --accent:      #2a6090;
  --accent-dim:  #5a90b8;
  --soon-dot:    #8a7030;
  --rain-color:  #3a6d8e;
  --btn-bg:      rgba(0,0,0,0.06);
  --btn-border:  rgba(0,0,0,0.12);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text-1);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ══ THEME TOGGLE ══ */
#theme-btn {
  position: fixed;
  top: 14px; right: 14px;
  z-index: 400;
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 50%;
  width: 38px; height: 38px;
  font-size: 23px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background 0.15s;
}
#theme-btn:active { background: var(--card-border); }

/* ══ ADD-TO-HOME HINT ══ */
#home-hint {
  position: fixed;
  bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 10px 18px;
  font-size: 16px; font-weight: 400;
  color: var(--text-4);
  letter-spacing: 0.06em;
  text-align: center;
  z-index: 50;
  display: none;
  white-space: nowrap;
}

/* ══ MAIN LAYOUT ══ */
.main-screen {
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  height: 100vh;
  width: 100vw;
}

.divider {
  background: var(--divider);
  margin: 48px 0;
}

.left-col {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.time-quadrant {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  text-align: center;
  padding: 24px 40px 28px;
}
.calendar-quadrant {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
  padding: 36px 24px;
}

/* Weather is a button for reliable tap */
.weather-quadrant {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  text-align: center;
  padding: 20px 40px 36px;
  border-top: 1px solid var(--divider);
  background: none;
  border-left: none; border-right: none; border-bottom: none;
  cursor: pointer;
  color: inherit;
  font-family: inherit;
  width: 100%;
  -webkit-tap-highlight-color: rgba(255,255,255,0.05);
  touch-action: manipulation;
  outline: none;
}
.weather-quadrant:active { background: var(--card-bg); }

/* Location toggle (Clover / Oak Island) */
.loc-btn {
  align-self: center;
  margin-top: 14px;
  display: inline-block;
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 999px;
  color: var(--text-4);
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 9px 18px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 42px;
  white-space: nowrap;
}
.loc-btn:active { background: var(--card-border); }

/* ── TIME ── */
.time-display {
  font-family: 'DM Serif Display', serif;
  font-size: 163px;
  line-height: 0.9;
  letter-spacing: -4px;
  color: var(--text-1);
  font-weight: normal;
}
.time-ampm {
  font-size: 28px;
  font-weight: 200;
  color: var(--text-5);
  letter-spacing: 0.18em;
  margin-top: 14px;
}
.time-date {
  font-size: 22px;
  font-weight: 300;
  color: var(--text-5);
  margin-top: 8px;
  letter-spacing: 0.06em;
}

/* ── WEATHER ── */
.wx-temp-row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  line-height: 1;
}
.wx-temp-row > * + * { margin-left: 10px; }
.wx-icon { font-size: 55px; margin-bottom: 8px; }
.wx-temp {
  font-family: 'DM Serif Display', serif;
  font-size: 125px;
  color: var(--text-1);
  letter-spacing: -3px;
  font-weight: normal;
  line-height: 1;
}
.wx-unit { font-size: 40px; font-weight: 300; color: var(--text-4); margin-bottom: 12px; }
.wx-desc {
  font-size: 25px;
  font-weight: 300;
  color: var(--text-3);
  margin-top: 10px;
  text-transform: capitalize;
  letter-spacing: 0.04em;
}
.wx-meta {
  display: flex;
  flex-wrap: wrap;
  margin-top: 9px;
  justify-content: center;
}
.wx-meta-item { text-align: center; margin: 7px 16px; }
.wx-meta-label {
  font-size: 17px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-5);
  margin-bottom: 6px;
}
.wx-meta-val { font-size: 30px; font-weight: 400; color: var(--text-3); }
.wx-meta-val.rain { color: var(--rain-color); }
.wx-tap-hint {
  font-size: 17px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-5);
  margin-top: 14px;
}

/* ── CALENDAR ── */
.cal-header {
  align-self: flex-start;
  width: 100%;
  display: flex;
  align-items: center;
  margin-bottom: 28px;
}
.cal-header > * + * { margin-left: 10px; }
.cal-day-label {
  font-size: 23px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
}
.cal-nav-btn {
  background: none;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text-3);
  font-size: 28px;
  line-height: 1;
  padding: 4px 12px 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  font-family: inherit;
  min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
}
.cal-nav-btn:active { background: var(--card-bg); }
.cal-change-btn {
  background: none;
  border: 1px solid var(--accent-dim);
  border-radius: 8px;
  color: var(--accent);
  font-size: 19px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  font-family: inherit;
  display: none;
  min-height: 44px;
}
.cal-change-btn:active { background: var(--accent-dim); }
.cal-list { display: flex; flex-direction: column; width: 100%; max-width: 460px; }
.cal-list > * + * { margin-top: 22px; }
.cal-item {
  display: flex;
  align-items: flex-start;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: opacity 0.15s;
  text-align: left;
  min-height: 44px;
}
.cal-item:active { opacity: 0.6; }
.cal-item.past { opacity: 0.30; }
.cal-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.cal-item.soon .cal-dot { background: var(--soon-dot); }
.cal-item.past .cal-dot { background: var(--text-5); }
.cal-time {
  font-size: 23px; font-weight: 400; color: var(--text-3);
  min-width: 96px; width: 96px; white-space: nowrap; line-height: 1.2; letter-spacing: 0.03em;
}
.cal-title { font-size: 28px; font-weight: 400; color: var(--text-1); white-space: normal; line-height: 1.2; }
.cal-empty { font-size: 25px; font-weight: 400; color: var(--text-4); font-style: italic; }
.cal-loading { font-size: 23px; font-weight: 400; color: var(--text-5); font-style: italic; }

/* ── SIGN IN ── */
.cal-signin {
  align-self: flex-start;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
}
.cal-signin > * + * { margin-top: 14px; }
.cal-signin-hint {
  font-size: 22px;
  font-weight: 300;
  color: var(--text-4);
  letter-spacing: 0.06em;
  text-align: center;
}
.btn-signin {
  display: flex;
  align-items: center;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 14px 22px;
  cursor: pointer;
  color: var(--text-2);
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.04em;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background 0.15s, border-color 0.15s;
  min-height: 54px;
}
.btn-signin:active { background: var(--card-border); }
.btn-signin svg { flex-shrink: 0; width: 20px; height: 20px; margin-right: 12px; }

/* ══ WEATHER DETAIL OVERLAY ══ */
.detail-screen {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: var(--bg);
  z-index: 100;
  display: none;
  flex-direction: column;
  padding: 40px 48px 32px;
}

.detail-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 36px;
}
.detail-title {
  font-family: 'DM Serif Display', serif;
  font-size: 40px;
  color: var(--text-2);
  font-style: italic;
  font-weight: normal;
}
.detail-close-row {
  display: flex;
  align-items: center;
  cursor: pointer;
  min-height: 44px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.countdown-wrap { position: relative; width: 34px; height: 34px; }
.countdown-svg { transform: rotate(-90deg); }
.countdown-track { fill: none; stroke: var(--text-6); stroke-width: 2.5; }
.countdown-arc {
  fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round;
  stroke-dasharray: 88; stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}
.countdown-num {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 400; color: var(--accent);
}
.detail-close-hint { font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-5); }

/* HOURLY */
.section-label { font-size: 19px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-4); margin-bottom: 16px; }
.hourly-strip {
  display: flex; overflow-x: auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; margin-bottom: 36px;
}
.hourly-strip::-webkit-scrollbar { display: none; }
.hour-item {
  display: flex; flex-direction: column; align-items: center;
  min-width: 74px; padding: 14px 0;
  border-right: 1px solid var(--divider);
}
.hour-item:last-child { border-right: none; }
.hour-item.now { background: var(--card-bg); border-radius: 12px; }
.hour-label { font-size: 20px; color: var(--text-4); font-weight: 400; }
.hour-item.now .hour-label { color: var(--accent); }
.hour-wx-icon { font-size: 33px; line-height: 1; }
.hour-temp { font-size: 28px; font-weight: 400; color: var(--text-2); }
.hour-rain { font-size: 19px; color: var(--rain-color); }

/* DAILY */
.daily-strip { display: flex; }
.day-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 14px 0; border-right: 1px solid var(--divider);
}
.day-item:last-child { border-right: none; }
.day-name { font-size: 20px; color: var(--text-4); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
.day-icon { font-size: 35px; line-height: 1; }
.day-hi { font-family: 'DM Serif Display', serif; font-size: 35px; color: var(--text-2); font-weight: 500; line-height: 1; }
.day-lo { font-size: 22px; color: var(--text-4); font-weight: 400; }
.day-rain { font-size: 19px; color: var(--rain-color); }

/* ══ CAL DETAIL OVERLAY ══ */
.cal-detail {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  background: var(--bg-overlay);
  z-index: 200; display: none;
  align-items: center; justify-content: center;
}
.cal-detail-card { text-align: center; padding: 48px; max-width: 380px; }
.cal-detail-time { font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.cal-detail-title { font-family: 'DM Serif Display', serif; font-size: 48px; color: var(--text-1); line-height: 1.25; font-style: italic; }
.cal-detail-close { margin-top: 36px; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-5); cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }

/* ══ CALENDAR PICKER OVERLAY ══ */
.cal-picker {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  background: var(--bg-overlay);
  z-index: 300; display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  padding: 48px;
}
.cal-picker-title {
  font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 28px;
}
.cal-picker-list { display: flex; flex-direction: column; width: 100%; max-width: 340px; }
.cal-picker-list > * + * { margin-top: 10px; }
.cal-picker-item {
  display: flex; align-items: center;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 10px; padding: 16px 18px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.cal-picker-item:active { background: var(--card-border); }
.cal-picker-item.selected { border-color: var(--accent-dim); background: rgba(74,127,168,0.12); }
.cal-picker-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cal-picker-name { font-size: 26px; font-weight: 400; color: var(--text-3); }
.cal-picker-item.selected .cal-picker-name { color: var(--text-2); }

/* ══ FLEX-GAP FALLBACK (old iOS Safari ignores flexbox gap) ══ */
.cal-item > * + *        { margin-left: 16px; }
.detail-close-row > * + * { margin-left: 12px; }
.hour-item > * + *       { margin-top: 8px; }
.day-item > * + *        { margin-top: 8px; }
.cal-picker-item > * + * { margin-left: 14px; }
</style>
</head>
<body>

<!-- ═══ THEME TOGGLE ═══ -->
<button id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">☀️</button>

<!-- ═══ ADD TO HOME SCREEN HINT ═══ -->
<div id="home-hint">Tap Share → Add to Home Screen for fullscreen</div>

<!-- ═══ BUILD MARKER (temporary — confirms new version loaded) ═══ -->
<div style="position:fixed;bottom:4px;left:6px;font-size:11px;color:var(--text-5);opacity:0.55;z-index:500;font-family:sans-serif">build 12</div>

<!-- ═══ MAIN SCREEN ═══ -->
<div class="main-screen" id="main-screen">
  <div class="left-col">

    <!-- TIME -->
    <div class="time-quadrant">
      <div class="time-display" id="clock-time">10:47</div>
      <div class="time-ampm" id="clock-ampm">AM</div>
      <div class="time-date" id="clock-date">Thursday, June 7</div>
    </div>

    <!-- WEATHER -->
    <button class="weather-quadrant" id="wx-btn">
      <div class="wx-temp-row">
        <div class="wx-icon" id="wx-icon">⛅</div>
        <div class="wx-temp" id="wx-temp">--</div>
        <div class="wx-unit">°F</div>
      </div>
      <div class="wx-desc" id="wx-desc">Loading…</div>
      <div class="wx-meta">
        <div class="wx-meta-item">
          <div class="wx-meta-label">High / Low</div>
          <div class="wx-meta-val" id="wx-hilo">--°</div>
        </div>
        <div class="wx-meta-item">
          <div class="wx-meta-label">Humidity</div>
          <div class="wx-meta-val" id="wx-humidity">--%</div>
        </div>
        <div class="wx-meta-item" id="wx-rain-block" style="display:none">
          <div class="wx-meta-label">Rain</div>
          <div class="wx-meta-val rain" id="wx-precip">--%</div>
        </div>
      </div>
      <div class="wx-tap-hint">Tap for forecast ↓</div>
    </button>

    <button class="loc-btn" id="loc-btn">📍 <span id="loc-name">Clover</span> ⇄</button>

  </div>

  <div class="divider"></div>

  <!-- CALENDAR -->
  <div class="calendar-quadrant">
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev" onclick="calNav(-1)">‹</button>
      <span class="cal-day-label" id="cal-day-label">Today</span>
      <button class="cal-nav-btn" id="cal-next" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-list" id="cal-list">
      <div class="cal-loading">Loading calendar…</div>
    </div>
  </div>
</div>

<!-- ═══ WEATHER DETAIL ═══ -->
<div class="detail-screen" id="detail-screen">
  <div class="detail-top">
    <div class="detail-title">Weather Forecast</div>
    <div class="detail-close-row">
      <div class="countdown-wrap">
        <svg class="countdown-svg" viewBox="0 0 34 34" width="34" height="34">
          <circle class="countdown-track" cx="17" cy="17" r="13"/>
          <circle class="countdown-arc" id="countdown-arc" cx="17" cy="17" r="13"/>
        </svg>
        <div class="countdown-num" id="countdown-num">20</div>
      </div>
      <div class="detail-close-hint">Tap to close</div>
    </div>
  </div>
  <div class="section-label">Hourly</div>
  <div class="hourly-strip" id="hourly-strip"></div>
  <div class="section-label">7-Day</div>
  <div class="daily-strip" id="daily-strip"></div>
</div>

<!-- ═══ CALENDAR EVENT DETAIL ═══ -->
<div class="cal-detail" id="cal-detail">
  <div class="cal-detail-card">
    <div class="cal-detail-time" id="cal-detail-time"></div>
    <div class="cal-detail-title" id="cal-detail-title"></div>
    <div class="cal-detail-close">Tap to dismiss</div>
  </div>
</div>

<script>
// Prevent white screen from uncaught JS errors
window.onerror = function(msg, src, line) {
  var el = document.getElementById('cal-list');
  if (el && el.innerHTML === '<div class="cal-loading">Loading calendar…</div>') {
    el.innerHTML = '<div class="cal-empty" style="font-size:20px;color:var(--text-5)">JS error: ' + msg + '</div>';
  }
  return false;
};

// ════════════════════════════════
// CONFIG
// ════════════════════════════════
// Weather locations (toggle on the main screen). Both are Eastern time.
var LOCATIONS = {
  clover:    { name: 'Clover',     lat: 35.11,   lon: -81.06 },
  oakisland: { name: 'Oak Island', lat: 33.9137, lon: -78.1111 }
};
var selectedLoc = localStorage.getItem('selectedLoc');
if (selectedLoc !== 'clover' && selectedLoc !== 'oakisland') selectedLoc = 'clover';

// ════════════════════════════════
// iOS GHOST-CLICK SHIELD
// ════════════════════════════════
// On old iOS Safari, e.preventDefault() in a touchend handler does NOT reliably
// suppress the ~300-350ms delayed synthetic click. When a tap opens a full-screen
// overlay, that delayed click lands on the overlay (now under the finger) and
// triggers its "tap to close" handler — so the overlay opens then instantly
// closes, looking like the button "does nothing."
//
// Fix: when an overlay opens, make it ignore ALL pointer input for a short window.
// The stray synthetic click then hits nothing on the overlay and is harmless.
// This does not depend on guessing the exact click delay, so it is robust across
// old and new iOS versions.
function gateOverlay(el) {
  el.style.pointerEvents = 'none';
  setTimeout(function() { el.style.pointerEvents = ''; }, 600);
}

// XHR helper (replaces fetch — works on old iOS Safari)
function xhrGet(url, headers, onSuccess, onError) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 15000;
  if (headers) {
    for (var k in headers) { if (headers.hasOwnProperty(k)) xhr.setRequestHeader(k, headers[k]); }
  }
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      try { onSuccess(JSON.parse(xhr.responseText)); } catch(e) { onError(e); }
    } else {
      onError({ status: xhr.status });
    }
  };
  xhr.onerror   = function() { onError({ status: 0 }); };
  xhr.ontimeout = function() { onError({ status: -1 }); };
  xhr.send();
}

// CLOCK
// ════════════════════════════════
function updateClock() {
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock-time').textContent = h + ':' + (m < 10 ? '0' : '') + m;
  document.getElementById('clock-ampm').textContent = ampm;
  var days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clock-date').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();

  // At midnight: snap the calendar back to Today and refresh weather + events
  var ds = now.toDateString();
  if (ds !== lastDateStr) {
    lastDateStr = ds;
    calDayOffset = 0;
    var lbl = document.getElementById('cal-day-label');
    if (lbl) lbl.textContent = calDayLabel();
    fetchCalendar();
    fetchWeather();
  }
}
var lastDateStr = new Date().toDateString();
setInterval(updateClock, 1000);
updateClock();

// ════════════════════════════════
// WEATHER
// ════════════════════════════════
var WX_ICONS  = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
var WX_DESCS  = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Foggy',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

var cachedWeatherData = null;
var wxRetries = 0;

function fetchWeather() {
  wxRetries = 0;
  doFetchWeather();
}

function doFetchWeather() {
  var loc = LOCATIONS[selectedLoc];
  var url = 'https://api.open-meteo.com/v1/forecast' +
    '?latitude=' + loc.lat + '&longitude=' + loc.lon +
    '&current=temperature_2m,relative_humidity_2m,weather_code' +
    '&hourly=temperature_2m,weather_code,precipitation_probability' +
    '&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max' +
    '&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=7';

  // XHR for max compatibility (old iOS Safari)
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 15000;
  xhr.onload = function() {
    if (xhr.status < 200 || xhr.status >= 300) { handleWxError(); return; }
    try {
      var d = JSON.parse(xhr.responseText);
      if (!d || !d.current) { handleWxError(); return; }
      cachedWeatherData = d;
      wxRetries = 0;
      var c = d.current, daily = d.daily;
      var code = c.weather_code;
      document.getElementById('wx-icon').textContent     = WX_ICONS[code] || '🌡️';
      document.getElementById('wx-temp').textContent     = Math.round(c.temperature_2m);
      document.getElementById('wx-desc').textContent     = WX_DESCS[code] || '';
      document.getElementById('wx-humidity').textContent = c.relative_humidity_2m + '%';
      document.getElementById('wx-hilo').textContent     = Math.round(daily.temperature_2m_max[0]) + ' / ' + Math.round(daily.temperature_2m_min[0]) + '°';
      var rain = daily.precipitation_probability_max[0];
      if (rain > 0) {
        document.getElementById('wx-precip').textContent        = rain + '%';
        document.getElementById('wx-rain-block').style.display = 'block';
      }
    } catch(e) { handleWxError(); }
  };
  xhr.onerror   = handleWxError;
  xhr.ontimeout = handleWxError;
  xhr.send();
}

function handleWxError() {
  if (wxRetries < 3) {
    wxRetries++;
    setTimeout(doFetchWeather, wxRetries * 8000);
  } else {
    document.getElementById('wx-desc').textContent = 'Unavailable';
  }
}

setTimeout(fetchWeather, 300);
setInterval(fetchWeather, 10 * 60 * 1000);

// ════════════════════════════════
// WEATHER DETAIL
// ════════════════════════════════
var detailTimer = null;
var detailSecs  = 20;
var wxDetailOpenedAt = 0;
var calDetailOpenedAt = 0;
var calDetailTimer = null;
var calDetailSecs  = 20;
var C = 2 * Math.PI * 13; // circumference for r=13

function openWeatherDetail() {
  if (cachedWeatherData) {
    renderHourly(cachedWeatherData);
    renderDaily(cachedWeatherData);
  } else {
    document.getElementById('hourly-strip').innerHTML = '<span style="color:var(--text-5);font-size:19px;font-weight:400;padding:14px">Loading…</span>';
    document.getElementById('daily-strip').innerHTML  = '';
  }
  wxDetailOpenedAt = Date.now();
  var ds = document.getElementById('detail-screen');
  ds.style.display = 'flex';
  gateOverlay(ds);
  detailSecs = 20;
  tickCountdown();
  clearInterval(detailTimer);
  detailTimer = setInterval(function() {
    detailSecs--;
    tickCountdown();
    if (detailSecs <= 0) closeWeatherDetail();
  }, 1000);
}

function closeWeatherDetail() {
  clearInterval(detailTimer);
  document.getElementById('detail-screen').style.display = 'none';
}

function tickCountdown() {
  document.getElementById('countdown-num').textContent = detailSecs;
  document.getElementById('countdown-arc').style.strokeDashoffset = C * (1 - detailSecs / 20);
}

function renderHourly(d) {
  var times = d.hourly.time, startIdx = 0;
  // Find "Now" using the forecast's own UTC offset, so it is correct regardless of
  // the iPad's timezone and avoids old-Safari date-string parsing quirks.
  var offMs = (typeof d.utc_offset_seconds === 'number' ? d.utc_offset_seconds : 0) * 1000;
  var ln = new Date(Date.now() + offMs);
  var nowKey = ln.getUTCFullYear() + '-' + pad2(ln.getUTCMonth() + 1) + '-' + pad2(ln.getUTCDate()) + 'T' + pad2(ln.getUTCHours()) + ':00';
  for (var j = 0; j < times.length; j++) { if (times[j] <= nowKey) startIdx = j; else break; }
  var html = '';
  for (var i = startIdx; i < Math.min(startIdx + 13, times.length); i++) {
    var isNow = (i === startIdx);
    var hh = parseInt(times[i].slice(11, 13), 10); // hour read straight from "YYYY-MM-DDTHH:MM"
    var ampm = hh >= 12 ? 'PM' : 'AM', h12 = hh % 12 || 12;
    var label = isNow ? 'Now' : h12 + ' ' + ampm;
    var rain  = d.hourly.precipitation_probability[i];
    // The "Now" cell uses the live current reading so it always matches the main display
    var temp = (isNow && d.current && d.current.temperature_2m != null) ? d.current.temperature_2m : d.hourly.temperature_2m[i];
    var code = (isNow && d.current && d.current.weather_code != null) ? d.current.weather_code : d.hourly.weather_code[i];
    html += '<div class="hour-item' + (isNow ? ' now' : '') + '">' +
      '<div class="hour-label">' + label + '</div>' +
      '<div class="hour-wx-icon">' + (WX_ICONS[code] || '🌡️') + '</div>' +
      '<div class="hour-temp">' + Math.round(temp) + '°</div>' +
      (rain > 0 ? '<div class="hour-rain">' + rain + '%</div>' : '<div class="hour-rain" style="opacity:0">0%</div>') +
      '</div>';
  }
  document.getElementById('hourly-strip').innerHTML = html;
}

function renderDaily(d) {
  var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var html = '';
  for (var i = 0; i < d.daily.time.length; i++) {
    var dp = d.daily.time[i].split('-');
    var dow = (i === 0) ? 'Today' : dayNames[new Date(+dp[0], +dp[1] - 1, +dp[2]).getDay()];
    var rain = d.daily.precipitation_probability_max[i];
    html += '<div class="day-item">' +
      '<div class="day-name">' + dow + '</div>' +
      '<div class="day-icon">' + (WX_ICONS[d.daily.weather_code[i]] || '🌡️') + '</div>' +
      '<div class="day-hi">' + Math.round(d.daily.temperature_2m_max[i]) + '°</div>' +
      '<div class="day-lo">' + Math.round(d.daily.temperature_2m_min[i]) + '°</div>' +
      (rain > 0 ? '<div class="day-rain">' + rain + '%</div>' : '<div class="day-rain" style="opacity:0">0%</div>') +
      '</div>';
  }
  document.getElementById('daily-strip').innerHTML = html;
}

// ════════════════════════════════
// CALENDAR
// ════════════════════════════════
var calEvents    = [];
var calDayOffset = 0;

function calDayLabel() {
  if (calDayOffset === 0)  return 'Today';
  if (calDayOffset === 1)  return 'Tomorrow';
  if (calDayOffset === -1) return 'Yesterday';
  var d = new Date();
  d.setDate(d.getDate() + calDayOffset);
  var days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
}

function calNav(delta) {
  calDayOffset = Math.max(-30, Math.min(30, calDayOffset + delta));
  document.getElementById('cal-day-label').textContent = calDayLabel();
  renderFromCache(null); // instant — the ±31-day window is already cached
}

// Calendar data comes from the site's own Netlify function, which reads the
// calendar's private iCal feed. No sign-in, no tokens, nothing to expire.
var calAll = null; // cached ±31-day event window from the server
var calRetries = 0;

function fetchCalendar() {
  calRetries = 0;
  doFetchCalendar();
}

function doFetchCalendar() {
  xhrGet('/.netlify/functions/calendar', null,
    function(d) {
      if (d && d.error) {
        if (!calAll) renderCalendar([], d.error === 'ICAL_URL not set' ? 'Calendar not configured yet' : 'Calendar unavailable');
        return; // keep showing the cached events on a transient feed error
      }
      calAll = (d && d.events) || [];
      calRetries = 0;
      renderFromCache(null);
    },
    function() {
      // Retry with backoff — right after the iPad wakes, this request often fires
      // before Wi-Fi has reconnected (the weather already retried like this).
      if (calRetries < 3) {
        calRetries++;
        setTimeout(doFetchCalendar, calRetries * 8000);
        if (!calAll) renderCalendar([], 'Reconnecting…');
      } else if (calAll) {
        renderFromCache(null);
      } else {
        renderCalendar([], 'Network error');
      }
    }
  );
}

// Filter the cached window down to the selected day and render it
function renderFromCache(errMsg) {
  if (!calAll) { fetchCalendar(); return; }
  var base = new Date();
  var dayStart = new Date(base.getFullYear(), base.getMonth(), base.getDate() + calDayOffset, 0, 0, 0).getTime();
  var dayEnd = dayStart + 86400000;
  var now = Date.now();
  var events = [];
  for (var i = 0; i < calAll.length; i++) {
    var ev = calAll[i];
    var end = Math.max(ev.end || ev.start, ev.start);
    if (ev.start < dayEnd && end > dayStart) {
      var timeLabel = 'All day', past = false, soon = false;
      if (!ev.allDay) {
        var dt = new Date(ev.start);
        var hh = dt.getHours(), mm = dt.getMinutes();
        var ap = hh >= 12 ? 'PM' : 'AM';
        timeLabel = (hh % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + ' ' + ap;
        past = ev.start < now;
        soon = !past && (ev.start - now) < 3600000;
      } else {
        past = end <= now;
      }
      events.push({ title: ev.title || 'Untitled', time: timeLabel, past: past, soon: soon });
    }
  }
  renderCalendar(events, errMsg);
}

function renderCalendar(events, errMsg) {
  calEvents = events;
  var el = document.getElementById('cal-list');
  if (errMsg) {
    el.innerHTML = '<div class="cal-empty" style="font-size:19px;color:var(--text-4)">' + escHtml(errMsg) + '</div>';
    return;
  }
  if (!events.length) {
    el.innerHTML = '<div class="cal-empty">No events</div>';
    return;
  }
  el.innerHTML = '';
  var limit = Math.min(events.length, 6);
  for (var i = 0; i < limit; i++) {
    var ev   = events[i];
    var item = document.createElement('div');
    item.className = 'cal-item ' + (ev.past ? 'past' : ev.soon ? 'soon' : '');
    item.innerHTML =
      '<div class="cal-dot"></div>' +
      '<div class="cal-time">' + escHtml(ev.time) + '</div>' +
      '<div class="cal-title">' + escHtml(ev.title) + '</div>';
    item.setAttribute('data-idx', i);
    item.addEventListener('touchend', function(e) { e.preventDefault(); openCalDetail(+this.getAttribute('data-idx')); });
    item.addEventListener('click',    function()  { openCalDetail(+this.getAttribute('data-idx')); });
    el.appendChild(item);
  }
}

function openCalDetail(i) {
  var ev = calEvents[i];
  if (!ev) return;
  document.getElementById('cal-detail-time').textContent  = ev.time;
  document.getElementById('cal-detail-title').textContent = ev.title;
  calDetailOpenedAt = Date.now();
  var cd = document.getElementById('cal-detail');
  cd.style.display = 'flex';
  gateOverlay(cd);
  calDetailSecs = 20;
  clearInterval(calDetailTimer);
  var closeEl = document.querySelector('.cal-detail-close');
  if (closeEl) closeEl.textContent = 'Tap to dismiss (20)';
  calDetailTimer = setInterval(function() {
    calDetailSecs--;
    var closeEl = document.querySelector('.cal-detail-close');
    if (closeEl) closeEl.textContent = 'Tap to dismiss (' + calDetailSecs + ')';
    if (calDetailSecs <= 0) closeCalDetail();
  }, 1000);
}

function closeCalDetail() {
  clearInterval(calDetailTimer);
  document.getElementById('cal-detail').style.display = 'none';
  var closeEl = document.querySelector('.cal-detail-close');
  if (closeEl) closeEl.textContent = 'Tap to dismiss';
}

fetchCalendar();
setInterval(fetchCalendar, 5 * 60 * 1000);

// Refresh everything the moment the iPad wakes / the app returns to the foreground.
// Overnight, iOS suspends the page; on wake the timers may not have fired yet and
// the first automatic refresh could be minutes away — this makes it instant.
function wakeRefresh() {
  updateClock();
  fetchCalendar();
  fetchWeather();
}
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) wakeRefresh();
});
window.addEventListener('pageshow', wakeRefresh);

// ════════════════════════════════
// HELPERS
// ════════════════════════════════
function pad2(n) { return (n < 10 ? '0' : '') + n; }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Scroll to hide iOS Safari address bar when not in standalone mode
window.addEventListener('load', function() {
  setTimeout(function() { window.scrollTo(0, 1); }, 150);
});
</script>
